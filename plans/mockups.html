<script>
const state=new URLSearchParams(location.search).get('state')||'ready';
const done=state==='finished', recording=state==='recording', paused=state==='paused';
const button=(label,primary=false)=>`<button class="button ${primary?'primary':''}">${label}</button>`;
document.querySelector('#top').innerHTML=done?'<div class="clip"><div><strong>Monologue-2026-09-17-140532.mp4</strong><p>01:24 · 3840 × 2160 · 30 fps · Stereo</p></div>'+button('New recording')+'</div>':`<div class="sources ${recording||paused?'locked':''}"><div class="select"><span>▣</span><div><div class="label">Camera</div><div class="name">Logitech BRIO</div></div><span class="chevron">⌄</span></div><div class="select"><span>♩</span><div><div class="label">Microphone</div><div class="name">RØDE NT-USB Mini</div></div><span class="chevron">⌄</span></div></div>`;
document.querySelector('#badge').innerHTML=`<i style="background:${recording?'#f06c6c':paused?'#e2c77c':'#a3bd9c'}"></i>${done?'Preview':recording?'Recording':paused?'Paused':'Ready'}`;
const meter='<div class="meter"><span class="meter-label">MIC</span><div class="bars">'+Array.from({length:28},(_,i)=>`<b class="${i<19?'on':i<22?'warm':''}"></b>`).join('')+'</div><span class="level">−9 dBFS</span></div>';
document.querySelector('#controls').innerHTML=done?'<div class="transport">'+button('▶')+'<span class="time" style="font-size:12px">00:29</span><div class="seek"></div><span class="time" style="font-size:12px">01:24</span><div class="done-actions">'+button('Save…')+button('Open in Omacut ↗',true)+'</div></div>':'<div class="transport">'+button(recording?'Ⅱ &nbsp; Pause':paused?'● &nbsp; Resume':'● &nbsp; Record',!recording)+`<span class="time">${recording||paused?'01:24':'00:00'}</span>`+(recording||paused?button('■ &nbsp; Finish'):'')+meter+'</div>';
document.querySelector('#footer').innerHTML=done?'<span>Kept in Recordings until you discard it</span><span><kbd>Space</kbd> Play / pause</span>':`<span><kbd>Space</kbd> ${recording?'Pause':paused?'Resume':'Record'}${recording||paused?' &nbsp; <kbd>Ctrl ↵</kbd> Finish':''}</span><span>${paused?'Preview and mic are live · recording is paused':recording?'Sources locked during this take':'Sources remembered automatically'}</span>`;
document.querySelector('#caption').textContent=({ready:'01 / Ready to record',recording:'02 / Recording a take',paused:'03 / Pause, rehearse, resume',finished:'04 / Save or continue in Omacut'})[state];
</script></html>
