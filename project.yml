name: Mac-Monologue

options:
  bundleIdPrefix: io.github.alexanderpuschkinberlin
  createIntermediateGroups: true
  developmentLanguage: en
  deploymentTarget:
    macOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "8"
    # Self-signed identity comes later (see DESIGN.md, Distribution).
    # Ad-hoc for now; sandbox and hardened runtime stay off by design.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_APP_SANDBOX: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Mac-Monologue:
    type: application
    platform: macOS
    sources:
      - path: Sources/MacMonologue
      - path: Resources
        buildPhase: resources
    dependencies:
      # Explicit: auto-linking does not pull AVKit in, and SwiftUI's VideoPlayer
      # then crashes at runtime failing to demangle AVPlayerView.
      - sdk: AVFoundation.framework
      - sdk: AVKit.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: CoreImage.framework
      - sdk: Metal.framework
      - sdk: ScreenCaptureKit.framework
      - sdk: CryptoKit.framework
      - sdk: Security.framework
      - sdk: Vision.framework
      - sdk: Speech.framework
      - sdk: Translation.framework
      # RegisterEventHotKey: global hotkeys without the Input Monitoring
      # permission a global NSEvent monitor would need.
      - sdk: Carbon.framework
    settings:
      base:
        PRODUCT_NAME: Mac-Monologue
        PRODUCT_BUNDLE_IDENTIFIER: io.github.alexanderpuschkinberlin.mac-monologue
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/MacMonologue/Info.plist
        COMBINE_HIDPI_IMAGES: YES

  MacMonologueTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MacMonologueTests
    dependencies:
      - target: Mac-Monologue
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.alexanderpuschkinberlin.mac-monologue.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Mac-Monologue:
    build:
      targets:
        Mac-Monologue: all
        MacMonologueTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MacMonologueTests
